name: Deploy to ECS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: anonymous_defenders
  ECS_SERVICE: anonymous-defenders-service
  ECS_CLUSTER: anonymous-defenders
  ECS_TASK_DEFINITION: ecs-task-definition.json
  CONTAINER_NAME: anonymous-defenders

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      
    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        
    - name: Fill in the new image ID in the Amazon ECS task definition
      id: task-def
      run: |
        # Update the task definition with the new image
        jq '.containerDefinitions[0].image = "${{ steps.build-image.outputs.image }}"' $ECS_TASK_DEFINITION > temp-task-definition.json
        mv temp-task-definition.json $ECS_TASK_DEFINITION
        cat $ECS_TASK_DEFINITION
        
    - name: Register Amazon ECS task definition
      id: register-task-definition
      run: |
        aws ecs register-task-definition --cli-input-json file://$ECS_TASK_DEFINITION --output text > task-definition.json
        TASK_REVISION=$(cat task-definition.json | grep revision | tr -s ' ' | cut -d ' ' -f 2)
        echo "task-definition-revision=$TASK_REVISION" >> $GITHUB_OUTPUT
        
    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
