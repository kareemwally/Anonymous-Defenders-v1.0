name: Complete Deploy to ECS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: anonymous_defenders
  ECS_SERVICE: anonymous-defenders-service
  ECS_CLUSTER: anonymous-defenders
  CONTAINER_NAME: anonymous-defenders

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      
    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        echo "Building image with tag: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        
    - name: Create CloudWatch Log Group
      run: |
        aws logs create-log-group --log-group-name /ecs/anonymous-defenders --region $AWS_REGION || true
        
    - name: Register Amazon ECS task definition
      id: register-task-definition
      env:
        IMAGE: ${{ steps.build-image.outputs.image }}
        DB_URI: ${{ secrets.DB_URI }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        PAYMOB_API_KEY: ${{ secrets.PAYMOB_API_KEY }}
        PAYMOB_HMAC_SECRET: ${{ secrets.PAYMOB_HMAC_SECRET }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        GITHUB_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
        AI_MODEL_TOKEN: ${{ secrets.AI_MODEL_TOKEN }}
      run: |
        # Install jq
        sudo apt-get update && sudo apt-get install -y jq

        # Inject image + all secrets into the task definition.
        # Secrets are passed via env vars (never interpolated directly into the
        # shell command) so they don't leak into the runner logs or process list.
        jq \
          --arg image            "$IMAGE" \
          --arg db_uri           "$DB_URI" \
          --arg jwt_secret       "$JWT_SECRET" \
          --arg email_pass       "$EMAIL_PASS" \
          --arg paymob_api_key   "$PAYMOB_API_KEY" \
          --arg paymob_hmac      "$PAYMOB_HMAC_SECRET" \
          --arg google_secret    "$GOOGLE_CLIENT_SECRET" \
          --arg github_secret    "$GITHUB_CLIENT_SECRET" \
          --arg ai_token         "$AI_MODEL_TOKEN" \
          '
          .containerDefinitions[0].image = $image |
          (.containerDefinitions[0].environment[] | select(.name == "DB_URI")).value               = $db_uri |
          (.containerDefinitions[0].environment[] | select(.name == "JWT_SECRET")).value           = $jwt_secret |
          (.containerDefinitions[0].environment[] | select(.name == "EMAIL_PASS")).value           = $email_pass |
          (.containerDefinitions[0].environment[] | select(.name == "PAYMOB_API_KEY")).value       = $paymob_api_key |
          (.containerDefinitions[0].environment[] | select(.name == "PAYMOB_HMAC_SECRET")).value   = $paymob_hmac |
          (.containerDefinitions[0].environment[] | select(.name == "GOOGLE_CLIENT_SECRET")).value = $google_secret |
          (.containerDefinitions[0].environment[] | select(.name == "GITHUB_CLIENT_SECRET")).value = $github_secret |
          (.containerDefinitions[0].environment[] | select(.name == "AI_MODEL_TOKEN")).value       = $ai_token
          ' ecs-task-definition-simple.json > temp-task-definition.json

        # Register task definition
        aws ecs register-task-definition --cli-input-json file://temp-task-definition.json --output text > task-definition.json
        TASK_REVISION=$(cat task-definition.json | grep revision | awk '{print $2}')
        echo "task-definition-revision=$TASK_REVISION" >> $GITHUB_OUTPUT
        
    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: temp-task-definition.json
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
        
    - name: Verify deployment
      run: |
        echo "Waiting for deployment to stabilize..."
        sleep 60
        
        # Check service status
        aws ecs describe-services --cluster ${{ env.ECS_CLUSTER }} --services ${{ env.ECS_SERVICE }} --query 'services[0].{status:status,runningCount:runningCount,desiredCount:desiredCount}'
        
        # Check running tasks
        aws ecs list-tasks --cluster ${{ env.ECS_CLUSTER }} --query 'taskArns'
        
        echo "Deployment completed successfully!"
        echo "Load Balancer URL: http://anonymous-defenders-alb-593198813.us-east-1.elb.amazonaws.com"
